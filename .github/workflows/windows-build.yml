name: Windows packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - companion
      - windows-visual-tuning
    paths:
      - "Windows/**"
      - "Sources/CharacterEfficiencyIsland/Assets/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "Windows/**"
      - "Sources/CharacterEfficiencyIsland/Assets/**"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        character:
          - generic
          - huang-shaotian
          - zhang-xinjie
          - ye-xiu
          - ye-xiu-a
          - su-mucheng
          - su-muqiu
          - yu-wenzhou
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Select product flavor
        id: flavor
        shell: pwsh
        run: |
          $companionBranches = @("companion", "windows-visual-tuning")
          $flavor = if ($companionBranches -contains "${{ github.ref_name }}") { "companion" } else { "dynamic-island" }
          "value=$flavor" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build self-contained EXE and ZIP
        shell: pwsh
        run: ./Windows/build_windows.ps1 -Flavor "${{ steps.flavor.outputs.value }}" -CharacterPack "${{ matrix.character }}" -Runtime win-x64

      - name: Verify package
        shell: pwsh
        run: ./Windows/verify_windows_package.ps1 -Flavor "${{ steps.flavor.outputs.value }}" -CharacterPack "${{ matrix.character }}" -Runtime win-x64

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: CharacterEfficiencyIsland-${{ steps.flavor.outputs.value }}-${{ matrix.character }}-win-x64
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
          if-no-files-found: error
